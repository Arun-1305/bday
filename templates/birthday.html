<!DOCTYPE html>
<html>
<head>
    <title>Happy Birthday</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #ff4d6d, #ff9a8b);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        h1 {
            font-size: 60px;
            color: white;
            text-align: center;
            text-shadow: 0 0 20px rgba(0,0,0,0.3);
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        .balloon {
            position: absolute;
            width: 100px;
            animation: float 6s infinite ease-in-out;
        }

        .balloon1 {
            left: 10%;
            bottom: -100px;
        }

        .balloon2 {
            right: 10%;
            bottom: -120px;
            animation-delay: 2s;
        }

        @keyframes float {
            0% { transform: translateY(0); }
            100% { transform: translateY(-120vh); }
        }
    </style>
</head>
<body>

<h1>HAPPY BIRTHDAYYY KALLOOO ❤️❤️❤️</h1>

<img src="https://cdn-icons-png.flaticon.com/512/3468/3468374.png" class="balloon balloon1">
<img src="https://cdn-icons-png.flaticon.com/512/3468/3468374.png" class="balloon balloon2">

</body>
</html>
