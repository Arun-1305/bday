<!DOCTYPE html>
<html>
<head>
    <title>Enter Password</title>
    <style>
        body {
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial;
        }

        .box {
            text-align: center;
        }

        input {
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
        }

        button {
            padding: 10px 20px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #22c55e;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Enter Date 👀</h2>
    <form method="POST">
        <input type="password" name="password" placeholder="Enter here">
        <br>
        <button type="submit">Submit</button>
    </form>
</div>

</body>
</html>
